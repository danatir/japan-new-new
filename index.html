:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:860px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
a{color:inherit}
h1,h2,h3,p{margin:0}
.stamp{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,8vw,56px);line-height:1.02;margin-top:6px}
.lede{color:var(--muted);max-width:60ch;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.c-P{color:var(--poke);background:var(--poke-t)} .c-H{color:var(--hall);background:var(--hall-t)}
.c-E{color:var(--event);background:var(--event-t)} .c-M{color:var(--merch);background:var(--merch-t)}
.c-S{color:var(--spot);background:var(--spot-t)} .c-V{color:var(--vint);background:var(--vint-t)}
.c-T{color:var(--trip);background:var(--trip-t)} .c-O{color:var(--other);background:var(--other-t)}
.bar{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
main{display:flex;flex-direction:column;gap:34px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button,.jump a{font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump a{font-family:var(--mono);font-size:11.5px;font-weight:500}
.jump a.h{border-color:var(--hot);color:var(--hot)}
.q{font:inherit;font-size:14px;padding:7px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
:focus-visible{outline:3px solid var(--event);outline-offset:2px}
.check{font-family:var(--mono);font-size:12px;color:var(--muted)}
section.grp{display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:6px}

.gh .sub{font-size:13px;color:var(--muted)}

section.grp.soon .gh{border-bottom-color:var(--soon)}
.row{display:grid;grid-template-columns:84px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:12px 14px 12px 12px}

.row.soon .when{background:var(--soon-t);color:var(--soon)}

.when .dow{font-family:var(--mono);font-size:10.5px}

.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.row h3{font-size:16px;font-weight:700;line-height:1.3}
.range{font-family:var(--mono);font-size:12.5px}
.range .where{color:var(--muted);font-family:var(--body);font-size:13px}
.row p{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}

.empty{color:var(--muted);padding:20px 0}

var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],MONL=["January","February","March","April","May","June","July","August","September","October","November","December"],DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function today(){try{return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}catch(e){return "2026-10-09";}}
function dn(s){var p=s.split("-");return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000);}
function iso(n){return new Date(n*86400000).toISOString().slice(0,10);}
function tokyoHour(){try{return +new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tokyo",hour:"2-digit",hourCycle:"h23"}).format(new Date());}catch(e){return 12;}}
var TODAY=today(),T0=dn(TODAY);
function parts(s){var p=s.split("-"),d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));return {dow:DOW[d.getUTCDay()],d:+p[2],m:MON[+p[1]-1],ml:MONL[+p[1]-1],y:+p[0]};}
function fd(s,w){var q=parts(s);return (w?q.dow+" ":"")+q.m+" "+q.d+(q.y!==parts(TODAY).y?" "+q.y:"");}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function pl(n,w){return n+" "+w+(n===1?"":"s");}

ITEMS.forEach(function(r){
  r.kind=r.tba?"tba":"undated";
  if(r.s||r.e){
    var s=r.s?dn(r.s):null,e=r.e?dn(r.e):null;
    if(e!==null&&e<T0)r.kind="ended";
    else if(e!==null){r.kind="dated";r.key=r.e;r.ks=s;}
    else if(s>T0){r.kind="dated";r.key=r.s;r.ks=s;}
    else r.kind="open";
    r.dl=r.kind==="dated"?dn(r.key)-T0:null;
  }
  r.hay=(r.t+" "+r.w+" "+r.d+" "+r.v+" "+CATS[r.c]).toLowerCase();
});

function pill(r){
  var d=r.dl,c=d<=3?"hot":d<=14?"soon":"far",one=r.s&&r.e&&r.s===r.e,noEnd=!r.e,t;
  if(d===0)t=one?"Today only":noEnd?"Starts today":"Last day today";
  else if(d===1)t=one?"Tomorrow only":noEnd?"Starts tomorrow":"Ends tomorrow";
  else t=(noEnd?"Starts in ":"Ends in ")+pl(d,"day");
  return [t,c];
}
function range(r){
  if(r.s&&r.e&&r.s!==r.e)return fd(r.s,1)+" → "+fd(r.e,1);
  if(r.s&&r.e)return fd(r.s,1);
  if(r.e)return "Until "+fd(r.e,1);
  if(r.s)return "From "+fd(r.s,1)+(r.kind==="dated"?"":" · no end date announced");
  return "";
}
function gsearch(q,img){return "https://www.google.com/search?"+(img?"tbm=isch&":"")+"q="+encodeURIComponent(q);}

function card(r){
  var dated=r.kind==="dated",cls="row k-"+r.c+(dated?(r.dl<=3?" hot":r.dl<=14?" soon":""):" compact");
  var a=el("article",cls);if(r.n)a.setAttribute("data-n",r.n);
  if(dated){
    var w=el("div","when"),q=parts(r.key);
    w.appendChild(el("span","lbl",r.s&&r.e&&r.s===r.e?"One day only":!r.e?"Starts":"Last day"));
    w.appendChild(el("span","dow",q.dow));w.appendChild(el("span","big",String(q.d)));w.appendChild(el("span","mon",q.m));
    a.appendChild(w);
  }
  var m=el("div","main"),top=el("div","top");
  var ch=el("span","chip c-"+r.c);ch.appendChild(el("i"));ch.appendChild(document.createTextNode(CATS[r.c]));top.appendChild(ch);
  if(dated){var p=pill(r);top.appendChild(el("span","pill "+p[1],p[0]));
    if(r.ks!==null&&r.ks>T0&&r.e&&r.s!==r.e)top.appendChild(el("span","tag","Opens "+fd(r.s,1)));}
  if(!r.n)top.appendChild(el("span","tag","From research"));
  if(r.fl)top.appendChild(el("span","tag warn",r.fl));
  m.appendChild(top);
  m.appendChild(el("h3","",r.t));
  if(r.w&&r.kind!=="ended")m.appendChild(el("p","w",r.w));
  var rg=range(r);
  if(rg||r.v||r.p){var rr=el("div","range");rr.appendChild(document.createTextNode(rg));
    var ex=[r.v,r.p].filter(Boolean).join(" · ");
    if(ex)rr.appendChild(el("span","where",(rg?"  ·  ":"")+ex));m.appendChild(rr);}
  if(r.d&&(r.kind==="ended"||r.d!==r.w)){
    if(r.kind==="ended")m.appendChild(el("p","",r.d));
    else{var dt=el("details","more");dt.appendChild(el("summary","","More details"));dt.appendChild(el("p","",r.d));m.appendChild(dt);}
  }
  var L=el("div","links");
  function lk(txt,href,ev){var x=el("a",ev?"ev":"",txt+" ↗");x.href=href;x.target="_blank";x.rel="noopener noreferrer";L.appendChild(x);}
  if(r.u)lk(r.ul&&r.ul.length<28?r.ul:"Event page",r.u,true);
  else if(r.kind!=="ended")lk("Find event page",gsearch(r.t+" 2026"),false);
  if(r.ig)lk("Instagram post #"+r.n+" (photos)",r.ig,false);else lk("Photos",gsearch(r.t+" Japan",true),false);
  m.appendChild(L);a.appendChild(m);r.node=a;return a;
}
ITEMS.forEach(card);

// ---------- layouts
function monthBucket(r){var q=parts(r.key);
  if(q.y>parts(TODAY).y)return {id:"later",order:900000,title:q.y+" and later",sub:"",cls:""};
  var k=q.y*12+(parseInt(r.key.slice(5,7),10)-1);return {id:"m"+k,order:100+k,title:q.ml,sub:"",cls:""};}
function allBucket(r){
  var d=r.dl,q=parts(r.key);
  if(d<=3){var nm=d===0?"Today · ":d===1?"Tomorrow · ":"";return {id:"d"+d,order:d,title:nm+q.dow+" "+q.m+" "+q.d,sub:"last day for everything here",cls:"hot"};}
  if(d<=9)return {id:"w1",order:10,title:"Next week",sub:fd(iso(T0+4),1)+" to "+fd(iso(T0+9),1),cls:"soon"};
  if(d<=16)return {id:"w2",order:11,title:"The week after",sub:fd(iso(T0+10),1)+" to "+fd(iso(T0+16),1),cls:"soon"};
  if(d<=22)return {id:"w3",order:12,title:"Rest of the month",sub:fd(iso(T0+17),1)+" to "+fd(iso(T0+22),1),cls:""};
  return monthBucket(r);
}
var live=ITEMS.filter(function(r){return r.kind==="dated"||r.kind==="open";});
function isOpenOn(r,D){return (!r.s||r.s<=D)&&(!r.e||r.e>=D);}
function dayGroups(D){
  var Dn=dn(D),g={},order=["last","soon","two","long","noend","later","over"];
  var defs={last:{title:"Last day is "+fd(D,1),sub:"ends this day, including one-day events",cls:"hot"},
    soon:{title:"Closing within 3 days after",sub:"ends "+fd(iso(Dn+1),1)+" to "+fd(iso(Dn+3),1),cls:"hot"},
    two:{title:"Closing within 2 weeks",sub:"ends "+fd(iso(Dn+4),1)+" to "+fd(iso(Dn+14),1),cls:"soon"},
    long:{title:"Open for longer",sub:"ends "+fd(iso(Dn+15),1)+" or later",cls:""},
    noend:{title:"Out now, no end date announced",sub:"drops and shops; check the page for stock",cls:""},
    over:{title:"Already over by "+fd(D,1),sub:"ended before this day",cls:""},
    later:{title:"Not open yet on "+fd(D,1),sub:"these start after this day",cls:""}};
  live.forEach(function(r){
    var k;
    if(!isOpenOn(r,D)){if(r.s&&r.s>D)(g.later=g.later||[]).push(r);else(g.over=g.over||[]).push(r);return;}
    if(!r.e)k="noend";else{var d=dn(r.e)-Dn;k=d<=0?"last":d<=3?"soon":d<=14?"two":"long";}
    (g[k]=g[k]||[]).push(r);
  });
  return order.filter(function(k){return g[k];}).map(function(k){
    if(k==="over"){g[k].sort(function(a,b){return a.e<b.e?1:-1;});}else if(k==="later"){g[k].sort(function(a,b){return a.s<b.s?-1:a.s>b.s?1:a.t<b.t?-1:1;});}else
    g[k].sort(function(a,b){return (a.e||"9999")<(b.e||"9999")?-1:(a.e||"9999")>(b.e||"9999")?1:a.t<b.t?-1:1;});
    return {id:"g-"+k,title:defs[k].title,sub:defs[k].sub,cls:defs[k].cls,items:g[k]};});
}
function allGroups(){
  var map={},list=[];
  ITEMS.filter(function(r){return r.kind==="dated";}).forEach(function(r){var b=allBucket(r);
    if(!map[b.id]){map[b.id]={id:b.id,order:b.order,title:b.title,sub:b.sub,cls:b.cls,items:[]};list.push(map[b.id]);}map[b.id].items.push(r);});
  list.sort(function(a,b){return a.order-b.order;});
  list.forEach(function(g){g.items.sort(function(a,b){return a.key<b.key?-1:a.key>b.key?1:(a.s||"")<(b.s||"")?-1:1;});});
  var open=ITEMS.filter(function(r){return r.kind==="open";}).sort(function(a,b){return a.s<b.s?1:-1;});
  if(open.length)list.push({id:"open",title:"Out now, no end date announced",sub:"drops and shops; check the page for stock",cls:"",items:open});
  return list;
}
function tail(){
  var t=[];
  var tba=ITEMS.filter(function(r){return r.kind==="tba";});
  if(tba.length)t.push({id:"tba",title:"Date not announced yet",sub:"saved, but no official date or release day",cls:"",items:tba});
  var pl2=ITEMS.filter(function(r){return r.kind==="undated";});
  t.push({id:"places",title:"Saved places, shops and tips",sub:"no dates, go any time",cls:"",items:pl2});
  return t;
}
var ended=ITEMS.filter(function(r){return r.kind==="ended";}).sort(function(a,b){return a.e<b.e?1:-1;});

// ---------- state + UI
var mode="day",D=iso(T0+(tokyoHour()>=18?1:0)),cur="all",root=document.getElementById("groups"),jump=document.getElementById("jump"),daysEl=document.getElementById("days"),modeEl=document.getElementById("mode"),catf=document.getElementById("catf"),q=document.getElementById("q");
var secs=[],det=null;

function mkMode(){
  modeEl.textContent="";
  [["day","What's open on a day"],["all","Everything by last day"]].forEach(function(it){
    var b=el("button","",it[1]);b.type="button";b.setAttribute("aria-pressed",mode===it[0]?"true":"false");
    b.addEventListener("click",function(){mode=it[0];mkMode();mkDays();layout();});modeEl.appendChild(b);});
}
function mkDays(){
  daysEl.textContent="";daysEl.hidden=mode!=="day";if(mode!=="day")return;
  daysEl.appendChild(el("span","lab","Open on:"));
  for(var i=0;i<=6;i++){(function(i){var d=iso(T0+i),p=parts(d);
    var b=el("button","",(i===0?"Today ":i===1?"Tomorrow ":"")+p.dow+" "+p.d);b.type="button";b.setAttribute("aria-pressed",d===D?"true":"false");
    b.addEventListener("click",function(){D=d;mkDays();layout();});daysEl.appendChild(b);})(i);}
  var inp=el("input");inp.type="date";inp.min=iso(T0);inp.value=D;inp.setAttribute("aria-label","Pick any date");
  inp.addEventListener("change",function(){if(inp.value&&inp.value>=iso(T0)){D=inp.value;mkDays();layout();}});daysEl.appendChild(inp);
}
function layout(){
  root.textContent="";secs=[];
  var groups=(mode==="day"?dayGroups(D):allGroups()).concat(tail());
  groups.forEach(function(g){
    var s=el("section","grp "+(g.cls||""));s.id=g.id;
    var h=el("div","gh");h.appendChild(el("h2","",g.title));if(g.sub)h.appendChild(el("span","sub",g.sub));
    var ct=el("span","ct");h.appendChild(ct);s.appendChild(h);
    g.items.forEach(function(r){s.appendChild(r.node);});
    root.appendChild(s);g.sec=s;g.ct=ct;secs.push(g);});
  det=el("details","end");det.id="ended";det.appendChild(el("summary","","Already ended"));
  ended.forEach(function(r){det.appendChild(r.node);});root.appendChild(det);
  groups.push({id:"ended",title:"Ended",isEnd:true});
  window.__groups=groups;
  apply();
}
function apply(){
  var term=q.value.trim().toLowerCase(),groups=window.__groups;
  ITEMS.forEach(function(r){var ok=(cur==="all"||r.c===cur)&&(!term||r.hay.indexOf(term)>=0);r.node.hidden=!ok;r.vis=ok;});
  secs.forEach(function(g){var n=g.items.filter(function(r){return r.vis;}).length;g.sec.hidden=!n;g.ct.textContent=n+(n===1?" item":" items");g.n=n;});
  var en=ended.filter(function(r){return r.vis;}).length;det.hidden=!en;det.querySelector("summary").textContent="Already ended ("+en+")";
  jump.textContent="";
  secs.forEach(function(g){if(!g.n)return;var a=el("a",g.cls==="hot"?"h":"",g.title.replace(/^Last day is /,"Last day ").split(" · ")[0].slice(0,34));a.href="#"+g.id;
    a.addEventListener("click",function(e){e.preventDefault();g.sec.scrollIntoView({behavior:"smooth",block:"start"});});jump.appendChild(a);});
}
[["all","All"]].concat(Object.keys(CATS).map(function(k){return [k,CATS[k]];})).forEach(function(it){
  var b=el("button");b.type="button";b.dataset.v=it[0];b.setAttribute("aria-pressed",it[0]==="all"?"true":"false");
  if(it[0]!=="all"){var i=el("i");i.style.background="var(--"+COLS[it[0]]+")";b.appendChild(i);}
  b.appendChild(document.createTextNode(it[1]));
  b.addEventListener("click",function(){cur=it[0];Array.prototype.forEach.call(catf.children,function(c){c.setAttribute("aria-pressed",c.dataset.v===cur?"true":"false");});apply();});
  catf.appendChild(b);});
q.addEventListener("input",apply);
mkMode();mkDays();layout();

var seen={};Array.prototype.forEach.call(document.querySelectorAll("[data-n]"),function(n){seen[n.getAttribute("data-n")]=1;});
var cnt=Object.keys(seen).length,extras=ITEMS.filter(function(r){return !r.n;}).length;
document.getElementById("check").textContent=(cnt===265?"Check passed: ":"CHECK FAILED: ")+cnt+" of 265 saved posts listed, plus "+extras+" events found online. Today is "+fd(TODAY,1)+" (Tokyo).";
document.getElementById("stamp").textContent='Saved collection "Japan new new" · '+fd(TODAY,1);
})();
</script>
</body>
</html>
